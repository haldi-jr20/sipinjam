<script>
        function switchTab(tab) {
            const loginBtn = document.getElementById('tab-login');
            const registerBtn = document.getElementById('tab-register');
            const loginView = document.getElementById('view-login');
            const registerView = document.getElementById('view-register');

            if (tab === 'login') {
                // Update Buttons
                loginBtn.className = "flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-300 bg-surface text-primary shadow-sm";
                registerBtn.className = "flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-300 text-on-surface-variant hover:text-primary";
                
                // Switch Views
                loginView.classList.remove('hidden');
                registerView.classList.add('hidden');
            } else {
                // Update Buttons
                registerBtn.className = "flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-300 bg-surface text-primary shadow-sm";
                loginBtn.className = "flex-1 py-2 text-center font-label-md text-label-md rounded-md transition-all duration-300 text-on-surface-variant hover:text-primary";
                
                // Switch Views
                registerView.classList.remove('hidden');
                loginView.classList.add('hidden');
            }
        }

        // Interactive Particle Trail Animation
        (function() {
            const canvas = document.createElement('canvas');
            canvas.style.position = 'fixed';
            canvas.style.top = '0';
            canvas.style.left = '0';
            canvas.style.width = '100vw';
            canvas.style.height = '100vh';
            canvas.style.pointerEvents = 'none';
            canvas.style.zIndex = '1';
            document.body.insertBefore(canvas, document.body.firstChild);
            
            const ctx = canvas.getContext('2d');
            let width = window.innerWidth;
            let height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;

            window.addEventListener('resize', () => {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            });

            const mouse = { x: width / 2, y: height / 2 };
            let lastMouse = { x: width / 2, y: height / 2 };
            
            window.addEventListener('mousemove', (e) => {
                lastMouse.x = mouse.x;
                lastMouse.y = mouse.y;
                mouse.x = e.clientX;
                mouse.y = e.clientY;
                addParticles();
            });

            class Particle {
                constructor(x, y) {
                    this.x = x + (Math.random() - 0.5) * 12;
                    this.y = y + (Math.random() - 0.5) * 12;
                    this.size = Math.random() * 2.5 + 1;
                    this.baseSize = this.size;
                    this.speedX = (Math.random() - 0.5) * 1.5;
                    this.speedY = (Math.random() - 0.5) * 1.5 - 0.5;
                    this.life = 1;
                    this.decay = Math.random() * 0.02 + 0.015;
                    
                    const colors = [
                        [53, 37, 205], // primary
                        [79, 70, 229], // primary-container
                        [92, 0, 202]   // tertiary
                    ];
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                }

                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    this.life -= this.decay;
                    this.size = this.baseSize * this.life;
                }

                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size > 0 ? this.size : 0, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${this.color[0]}, ${this.color[1]}, ${this.color[2]}, ${this.life})`;
                    ctx.fill();
                }
            }

            const particles = [];

            function addParticles() {
                const dx = mouse.x - lastMouse.x;
                const dy = mouse.y - lastMouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                const count = Math.min(Math.floor(dist * 0.15) + 1, 8);
                for(let i = 0; i < count; i++) {
                    particles.push(new Particle(mouse.x, mouse.y));
                }
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    if (particles[i].life > 0) {
                        particles[i].draw();
                    } else {
                        particles.splice(i, 1);
                        i--;
                    }
                }
                
                requestAnimationFrame(animate);
            }
            animate();
        })();
    </script>
