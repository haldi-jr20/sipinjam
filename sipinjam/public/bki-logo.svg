<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120" width="300" height="120">
  <!-- BKI Logo Recreation - PT Biro Klasifikasi Indonesia (Persero) 2021 -->
  
  <!-- Globe/Circle Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer circle -->
    <circle cx="50" cy="50" r="48" fill="none" stroke="#005BAC" stroke-width="4"/>
    
    <!-- Horizontal lines (latitude lines) -->
    <ellipse cx="50" cy="50" rx="48" ry="16" fill="none" stroke="#005BAC" stroke-width="2"/>
    <ellipse cx="50" cy="50" rx="48" ry="32" fill="none" stroke="#005BAC" stroke-width="2"/>
    
    <!-- Vertical oval (longitude line) -->
    <ellipse cx="50" cy="50" rx="20" ry="48" fill="none" stroke="#005BAC" stroke-width="2"/>
    
    <!-- Center horizontal line -->
    <line x1="2" y1="50" x2="98" y2="50" stroke="#005BAC" stroke-width="2"/>
    
    <!-- Center vertical line -->
    <line x1="50" y1="2" x2="50" y2="98" stroke="#005BAC" stroke-width="2"/>
  </g>

  <!-- "bki" text -->
  <text x="125" y="75" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="#005BAC" letter-spacing="-2">bki</text>
  
  <!-- Tagline text -->
  <text x="125" y="95" font-family="Arial, sans-serif" font-size="10" fill="#666666" letter-spacing="0.5">Biro Klasifikasi Indonesia</text>
</svg>
